datasets:
  - name: unemployment
    source: statfi
    endpoint: tyokay/statfin_tyokay_pxt_115x.px

    payload:
      query: []
      response:
        format: json

    transformation:
      dimensions:
        region: Alue
        year: Vuosi

      rename:
        tyottomyysaste: unemployment_rate
      
      types:
        year: int

      value_column: unemployment_rate

      filters: []

      join:
        region_mapping: true

    metadata:
      label: "Unemployment Rate"
      unit: "%"
      visualization:
        map:
          bins: [4, 6, 8, 10, 15]
  
  - name: education_upper_secondary
    source: statfi
    endpoint: vkour/statfin_vkour_pxt_12bs.px

    payload:
      query:
        - code: "Alue"
          selection:
            filter: "item"
            values: *all_supported_areas

        - code: "Ikä"
          selection:
            filter: "item"
            values:
              - "SSS"

        - code: "Sukupuoli"
          selection:
            filter: "item"
            values:
              - "SSS"

        - code: "Tiedot"
          selection:
            filter: "item"
            values:
              - "kaste3T8osuus"

      response:
        format: json

    transformation:
      dimensions:
        region: Alue
        year: Vuosi

      rename:
        kaste3T8osuus: upper_secondary_or_higher_pct

      types:
        year: int

      value_column: upper_secondary_or_higher_pct

      filters: []

      join:
        region_mapping: true

    metadata:
      label: "Share with at least upper secondary education"
      unit: "%"
      visualization:
        map:
          bins: [67, 70, 73, 76, 80]

  - name: education_tertiary
    source: statfi
    endpoint: vkour/statfin_vkour_pxt_12bs.px

    payload:
      query:
        - code: "Alue"
          selection:
            filter: "item"
            values: *all_supported_areas

        - code: "Ikä"
          selection:
            filter: "item"
            values:
              - "SSS"

        - code: "Sukupuoli"
          selection:
            filter: "item"
            values:
              - "SSS"

        - code: "Tiedot"
          selection:
            filter: "item"
            values:
              - "kaste5T8osuus"

      response:
        format: json

    transformation:
      dimensions:
        region: Alue
        year: Vuosi

      rename:
        kaste5T8osuus: tertiary_education_pct

      types:
        year: int

      value_column: tertiary_education_pct

      filters: []

      join:
        region_mapping: true

    metadata:
      label: "Share with at least tertiary education"
      unit: "%"
      visualization:
        map:
          bins: [18, 22, 25, 30, 38]

  - name: population
    source: statfi
    endpoint: vaerak/statfin_vaerak_pxt_11ra.px

    payload:
      query:
        - code: "Alue"
          selection:
            filter: "item"
            values: *all_supported_areas

        - code: "Tiedot"
          selection:
            filter: "item"
            values:
              - "vaesto"
       
      response:
        format: json

    transformation:
      dimensions:
        region: Alue
        year: Vuosi

      rename:
        vaesto: population

      types:
        year: int

      value_column: population

      filters: []

      join:
        region_mapping: true

    metadata:
      label: "Population"
      unit: "persons"
      visualization:
        map:
          bins: [5000, 20000, 50000, 100000, 300000]

  - name: employment_rate
    source: statfi
    endpoint: tyokay/statfin_tyokay_pxt_115x.px

    payload:
      query:
        - code: "Alue"
          selection:
            filter: "item"
            values: *all_supported_areas

        - code: "Tiedot"
          selection:
            filter: "item"
            values:
              - "tyollisyysaste"

      response:
        format: json

    transformation:
      dimensions:
        region: Alue
        year: Vuosi

      rename:
        tyollisyysaste: employment_rate

      types:
        year: int

      value_column: employment_rate

      filters: []

      join:
        region_mapping: true

    metadata:
      label: "Employment rate (18–64)"
      unit: "%"
      visualization:
        map:
          bins: [65, 70, 74, 78, 83]

  - name: elderly_share
    source: statfi
    endpoint: vaerak/statfin_vaerak_pxt_11ra.px

    payload:
      query:
        - code: "Alue"
          selection:
            filter: "item"
            values: *all_supported_areas

        - code: "Tiedot"
          selection:
            filter: "item"
            values:
              - "vaesto_yli64_p"

      response:
        format: json

    transformation:
      dimensions:
        region: Alue
        year: Vuosi

      rename:
        vaesto_yli64_p: elderly_share

      types:
        year: int

      value_column: elderly_share

      filters: []

      join:
        region_mapping: true

    metadata:
      label: "Share of population aged 65+"
      unit: "%"
      visualization:
        map:
          bins: [20, 25, 31, 37, 44]

  - name: foreign_background_share
    source: statfi
    endpoint: vaerak/statfin_vaerak_pxt_11ra.px

    payload:
      query:
        - code: "Alue"
          selection:
