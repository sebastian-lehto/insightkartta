    transformation:
      dimensions:
        region: Alue
        year: Vuosi

      rename:
        vaesto_tausta_ulk_p: foreign_background_share

      types:
        year: int

      value_column: foreign_background_share

      filters: []

      join:
        region_mapping: true

    metadata:
      label: "Share of foreign-background population"
      unit: "%"
      visualization:
        map:
          bins: [2, 4, 7, 15, 25]

  - name: population_change_rate
    source: statfi
    endpoint: vaerak/statfin_vaerak_pxt_11ra.px

    payload:
      query:
        - code: "Alue"
          selection:
            filter: "item"
            values: *all_supported_areas

        - code: "Tiedot"
          selection:
            filter: "item"
            values:
              - "kokmuutos_p"

      response:
        format: json

    transformation:
      dimensions:
        region: Alue
        year: Vuosi

      rename:
        kokmuutos_p: population_change_rate

      types:
        year: int

      value_column: population_change_rate

      filters: []

      join:
        region_mapping: true

    metadata:
      label: "Annual population change rate"
      unit: "%"
      visualization:
        map:
          bins: [-3, -1.5, -0.7, 0, 1]

  - name: median_income
    source: statfi
    endpoint: tjt/statfin_tjt_pxt_14ww.px

    payload:
      query:
        - code: "Alue"
          selection:
            filter: "item"
            values: *all_supported_areas

        - code: "Tiedot"
          selection:
            filter: "item"
            values:
              - "hkturaha18_med"

      response:
        format: json

    transformation:
      dimensions:
        region: Alue
        year: Vuosi

      rename:
        hkturaha18_med: median_income

      types:
        year: int

      value_column: median_income

      filters: []

      join:
        region_mapping: true

    metadata:
      label: "Median adult disposable income"
      unit: "EUR"
      visualization:
        map:
          bins: [22000, 23500, 25000, 27000, 30000]

  - name: low_income_rate
    source: statfi
    endpoint: tjt/statfin_tjt_pxt_14ww.px

    payload:
      query:
        - code: "Alue"
          selection:
            filter: "item"
